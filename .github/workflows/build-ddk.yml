name: build-lkm-ddk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup DDK
        run: |
          # 下载原作者预编译好的DDK环境（保证能直接编译）
          git clone --depth=1 https://github.com/inforcqb/ddk.git /tmp/ddk
          
      - name: Build module
        run: |
          export DDK_PATH=/tmp/ddk/android15-6.6
          make -C $DDK_PATH M=$PWD/kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 modules

      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: CAK_Test_Module
          path: kernel/*.ko
