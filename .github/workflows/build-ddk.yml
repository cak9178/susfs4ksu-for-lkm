name: build-lkm-ddk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Module
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev clang lld llvm

      - name: Clone GKI Kernel (6.6)
        run: |
          # 直接拉取 Android 官方 6.6 内核源码
          git clone --depth=1 -b android15-6.6 https://android.googlesource.com/kernel/common gki-kernel

      - name: Build Module
        run: |
          # 编译外部模块
          make -C gki-kernel ARCH=arm64 CC=clang LLVM=1 O=$(pwd)/gki-out gki_defconfig
          make -C gki-kernel ARCH=arm64 CC=clang LLVM=1 O=$(pwd)/gki-out M=$(pwd)/kernel modules

      - name: Upload ko
        uses: actions/upload-artifact@v4
        with:
          name: CAK_Test_Module
          path: kernel/*.ko
